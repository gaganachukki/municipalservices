<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | STACKLY</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-main);
      overflow: hidden;
      text-align: center;
    }
    .error-container {
      max-width: 600px;
      padding: 2rem;
    }
    .error-code {
      font-size: 10rem;
      font-family: var(--font-heading);
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 0;
      position: relative;
      display: inline-block;
    }
    .error-code::after {
      content: '';
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 20px;
      background: var(--color-secondary);
      opacity: 0.3;
      border-radius: 50%;
      filter: blur(10px);
      z-index: -1;
    }
    .error-text {
      font-size: 2rem;
      font-family: var(--font-heading);
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--color-text-muted);
      margin-bottom: 2.5rem;
    }
    .floating-illustration {
      font-size: 5rem;
      margin-bottom: -2rem;
      animation: float 4s ease-in-out infinite;
    }
    .button-group {
      display: flex; 
      gap: 1rem; 
      justify-content: center;
    }
    
    @media (max-width: 768px) {
      .error-code { font-size: 8rem; }
    }
    @media (max-width: 425px) {
      .error-container { padding: 1rem; }
      .error-code { font-size: 5rem; }
      .error-text { font-size: 1.5rem; }
      .floating-illustration { font-size: 4rem; }
      .button-group { flex-direction: column; width: 100%; }
      .button-group .btn { width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="error-container reveal-scale">
    <div class="floating-illustration"><i class="fa-solid fa-compass"></i></div>
    <h1 class="error-code">404!</h1>
    <h2 class="error-text">Page Not Found</h2>
    <p class="error-desc">Oops! The page you are looking for seems to have been moved, deleted, or does not exist. Let's get you back on track.</p>
    
    <div class="button-group">
      <button onclick="history.back()" class="btn btn-outline ripple">Go Back</button>
      <a href="index.html" class="btn btn-secondary ripple">Back To Home</a>
    </div>
  </div>

  <script src="assets/js/animation.js"></script>
</body>
</html>
