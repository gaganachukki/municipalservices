<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | STACKLY Municipal Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('assets/images/login-bg.webp') no-repeat center center/cover;
      font-family: var(--font-primary);
      overflow: hidden;
      position: relative;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(18,18,18,0.9) 0%, rgba(18,18,18,0.6) 100%);
      z-index: 1;
    }
    
    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 450px;
      padding: 2rem;
    }
    
    .glass-login {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      color: var(--color-white);
      text-align: center;
    }
    
    .logo {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      color: var(--color-secondary);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--color-light-gray);
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-sm);
      color: var(--color-white);
      font-family: var(--font-primary);
      transition: all var(--transition-fast);
      outline: none;
    }
    .form-control:focus {
      border-color: var(--color-secondary);
      background: rgba(255,255,255,0.1);
    }
    .form-control::placeholder {
      color: rgba(255,255,255,0.4);
    }
    
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      font-size: 0.85rem;
    }
    
    .options a {
      color: var(--color-secondary);
    }
    .options a:hover { text-decoration: underline; }
    
    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    
    .create-acc {
      font-size: 0.9rem;
      color: var(--color-light-gray);
    }
    .create-acc a {
      color: var(--color-white);
      font-weight: 600;
    }
    .create-acc a:hover {
      color: var(--color-secondary);
    }
    
    /* Background Animation */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite alternate;
    }
    .shape-1 {
      width: 400px;
      height: 400px;
      background: var(--color-secondary);
      top: -100px;
      left: -100px;
      opacity: 0.3;
    }
    .shape-2 {
      width: 300px;
      height: 300px;
      background: #4CAF50;
      bottom: -50px;
      right: -50px;
      opacity: 0.2;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0,0); }
      100% { transform: translate(50px, 50px); }
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="overlay"></div>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="login-container reveal-scale">
    <div class="glass-login">
      <a href="index.html" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
        STACKLY
      </a>
      <p style="margin-bottom: 2rem; color: var(--color-light-gray);">Sign in to access your citizen dashboard</p>
      
      <form action="index.html" class="validate-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" placeholder="citizen@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" placeholder="||||||||" required>
        </div>
        
        <div class="options">
          <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
            <input type="checkbox"> Remember Me
          </label>
          <a href="#">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn btn-secondary ripple btn-login">Login</button>
      </form>
      
      <div class="create-acc">
        New to Portal? <a href="#">Create Account</a>
      </div>
    </div>
  </div>

  <script src="assets/js/dashboard.js"></script>
</body>
</html>
