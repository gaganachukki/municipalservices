<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | STACKLY Municipal Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(5, 11, 20, 0.9), rgba(5, 11, 20, 0.9)), url('assets/images/login-bg.webp') no-repeat center center/cover;
      font-family: var(--font-primary);
      color: var(--color-white);
    }
    
    .auth-card {
      background: #08101a;
      width: 100%;
      max-width: 480px;
      padding: 3rem 2.5rem;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
    }

    .back-btn {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 100;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color var(--transition-fast);
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .back-btn:hover {
      color: var(--color-white);
    }

    .auth-header {
      text-align: left;
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: var(--color-white);
    }
    .auth-header p {
      color: var(--color-light-gray);
      font-size: 1rem;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .role-btn {
      background: #0d1624;
      border: 1px solid #1a2639;
      border-radius: var(--radius-sm);
      padding: 1.5rem 1rem;
      color: var(--color-white);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all var(--transition-fast);
      font-weight: 500;
    }
    .role-btn i {
      font-size: 1.5rem;
      color: rgba(255,255,255,0.5);
      transition: color var(--transition-fast);
    }
    .role-btn:hover {
      background: #111d2e;
    }
    .role-btn.active {
      border-color: var(--color-secondary);
      background: rgba(212, 175, 55, 0.05); /* very faint gold */
    }
    .role-btn.active i {
      color: var(--color-secondary);
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }
    .form-control {
      width: 100%;
      padding: 16px;
      background: #0d1624;
      border: 1px solid #1a2639;
      border-radius: var(--radius-sm);
      color: var(--color-white);
      font-family: var(--font-primary);
      font-size: 1rem;
      transition: all var(--transition-fast);
      outline: none;
    }
    .form-control:focus {
      border-color: var(--color-secondary);
      background: #111d2e;
    }
    .form-control::placeholder {
      color: rgba(255,255,255,0.3);
    }
    
    .eye-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 1.1rem;
    }
    .eye-toggle:hover {
      color: var(--color-white);
    }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .auth-options a {
      color: var(--color-secondary);
      text-decoration: none;
    }
    .auth-options a:hover {
      text-decoration: underline;
    }

    .custom-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--color-light-gray);
    }
    .custom-checkbox input {
      accent-color: var(--color-secondary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--color-secondary);
      color: var(--color-primary);
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: var(--font-primary);
      margin-bottom: 1.5rem;
    }
    .btn-submit:hover {
      background: var(--color-accent);
      transform: translateY(-2px);
    }

    .auth-footer {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 0.95rem;
    }
    .auth-footer a {
      color: var(--color-secondary);
      text-decoration: none;
      font-weight: 600;
      margin-left: 5px;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Sign in to access your account</p>
    </div>

    <form onsubmit="return handleLogin(event)">
      <div class="role-selector">
        <div class="role-btn active" onclick="selectRole(this, 'citizen')">
          <i class="fa-regular fa-user"></i>
          <span>Citizen</span>
        </div>
        <div class="role-btn" onclick="selectRole(this, 'staff')">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Municipal Staff</span>
        </div>
      </div>
      <input type="hidden" id="selectedRole" name="role" value="citizen">

      <div class="form-group">
        <input type="email" id="loginEmail" class="form-control" placeholder="Email Address" required>
      </div>
      <div class="form-group">
        <input type="password" class="form-control" id="password" placeholder="Password" required>
        <i class="fa-regular fa-eye eye-toggle" onclick="togglePassword('password', this)"></i>
      </div>

      <div class="auth-options">
        <label class="custom-checkbox">
          <input type="checkbox">
          Remember Me
        </label>
        <a href="404.html">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign Up</a>
    </div>
  </div>

  <script>
    function selectRole(element, role) {
      document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('selectedRole').value = role;
    }

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('loginEmail').value;
      if (email) {
        localStorage.setItem('userEmail', email);
      }
      
      const role = document.getElementById('selectedRole').value;
      if (role === 'staff') {
        window.location.href = 'admindashboard.html';
      } else {
        window.location.href = 'userdashboard.html';
      }
      return false;
    }
  </script>
</body>
</html>
